[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.25"]

[project]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows"]
description = "The Python support library of lungo's generated packages: the lungo runtime and the wire format"
dynamic = ["version"]
license = "Apache-2.0"
name = "lungo-py"
readme = "README.md"
requires-python = ">=3.9"
version = "1.3.19"

[[project.authors]]
email = "jowharshamshiri@gmail.com"
name = "Bahram Joharshamshiri"

[project.urls]
Homepage = "https://github.com/machinefabric/lungo"

[tool.hatch.build.targets.wheel]
packages = ["src/lungo_py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
path = "src/lungo_py/_version.py"
